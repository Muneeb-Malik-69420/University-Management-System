# Temporary evaluation demo: see DEPLOYMENT.md for free-plan limits.
services:
  - type: web
    name: campus-university-management
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: campus-db
          property: connectionString
databases:
  - name: campus-db
    plan: free
    region: frankfurt
    databaseName: campus
    user: campus
